spring.application.name=job-board
server.port=${PORT:8080}

# PostgreSQL (local defaults; override with env vars when hosting, e.g. Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health

# Login tokens are signed with this. Set a long random value when hosting; if empty, a random one is
# generated at startup (everyone is logged out on restart).
app.jwt-secret=${JWT_SECRET:}
app.jwt-days=${JWT_DAYS:30}
# Set to false to stop new sign-ups once you have your account
app.allow-registration=${ALLOW_REGISTRATION:true}
# Secret for the external cron (GitHub Actions) calling POST /api/refresh. Empty = endpoint disabled.
app.cron-secret=${CRON_SECRET:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Optional: free Adzuna API keys (https://developer.adzuna.com) for India/other country jobs
app.adzuna.app-id=${ADZUNA_APP_ID:}
app.adzuna.app-key=${ADZUNA_APP_KEY:}

# Optional: JSearch API key (LinkedIn, Indeed, Naukri, Glassdoor… via Google for Jobs). Get one at
# https://www.openwebninja.com (set JSEARCH_URL=https://api.openwebninja.com/jsearch/search) or on RapidAPI.
app.jsearch.api-key=${JSEARCH_API_KEY:}
app.jsearch.url=${JSEARCH_URL:https://jsearch.p.rapidapi.com/search}
# Free plans have a small monthly quota: run each search at most every N hours, fetching this many pages
app.jsearch.min-hours=${JSEARCH_MIN_HOURS:12}
app.jsearch.pages=${JSEARCH_PAGES:1}

# Schedules (cron: sec min hour day month weekday). Fetch new jobs, then remove closed ones.
app.sync.cron=${SYNC_CRON:0 0 */6 * * *}
app.cleanup.cron=${CLEANUP_CRON:0 30 */6 * * *}
# Delete untouched (NEW/SAVED) jobs older than this many days
app.cleanup.max-age-days=${CLEANUP_MAX_AGE_DAYS:30}
# Delete non-manual jobs the source stopped listing for this many days
app.cleanup.unlisted-days=${CLEANUP_UNLISTED_DAYS:5}
# How many job links to re-check per cleanup run
app.cleanup.link-checks-per-run=${CLEANUP_LINK_CHECKS:60}
